      // Display products
      function displayProducts() {
        const container = document.getElementById('productsContainer');
        hardcodedProducts.forEach(product => {
          const div = document.createElement('div');
          div.className = 'product-item';
          div.innerHTML = `
            <h3 class="font-bold text-lg">${product.name}</h3>
            <p>Original: $${product.originalPrice} | Sale: $${product.salePrice} (${product.discountPercentage}% off)</p>
            <p class="text-sm text-gray-600">Image: ${product.imageUrl.substring(0, 60)}...</p>
          `;
          container.appendChild(div);
        });
      }

      // Migration function
      async function migrateProducts() {
        const statusDiv = document.getElementById('status');
        const migrateBtn = document.getElementById('migrateBtn');
        
        migrateBtn.disabled = true;
        migrateBtn.textContent = 'Migrating...';
        statusDiv.innerHTML = '<p>Starting migration...</p>';
        statusDiv.className = 'status';

        try {
          // Wait for Supabase to be ready
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          if (!window.supabase) {
            throw new Error('Supabase client not initialized. Please check js/supabase-config.js');
          }

          const supabaseClient = window.supabase;
          let successCount = 0;
          let errorCount = 0;
          const errors = [];

          // Convert products to Supabase format
          const productsToInsert = hardcodedProducts.map(product => ({
            name: product.name,
            price: product.originalPrice,
            sale_price: product.salePrice,
            category: 'All', // Default category
            description: `${product.name} - Beautiful ${product.name.toLowerCase()} with ${product.discountPercentage}% discount`,
            images: [product.imageUrl], // Convert single image to array
            tags: [product.name.toLowerCase().replace(/\s+/g, '-')],
            in_stock: true,
            is_featured: true // CRITICAL: Mark all as featured
          }));

          // Insert products
          const { data, error } = await supabaseClient
            .from('products')
            .insert(productsToInsert)
            .select();

          if (error) {
            throw error;
          }

          successCount = data ? data.length : 0;
          
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `
            <h3 class="font-bold text-lg mb-2">Homepage Migration Complete!</h3>
            <p>Successfully migrated ${successCount} products to Supabase.</p>
            <p class="mt-2">All products have been marked as <strong>is_featured: true</strong>.</p>
            <p class="mt-2 text-sm">You can now delete this migration file (migrate-home.html).</p>
          `;

          migrateBtn.textContent = 'Migration Complete';
          migrateBtn.style.backgroundColor = '#28a745';

        } catch (error) {
          console.error('Migration error:', error);
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `
            <h3 class="font-bold text-lg mb-2">Migration Failed</h3>
            <p>Error: ${error.message}</p>
            <p class="mt-2 text-sm">Please check the browser console for more details.</p>
          `;
          migrateBtn.disabled = false;
          migrateBtn.textContent = 'Retry Migration';
        }
      }

      // Display products on load
      displayProducts();
    </script>
