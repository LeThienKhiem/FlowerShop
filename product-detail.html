<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>Product Detail - Magnolia</title>
  </head>
  <body>
    <div class="min-h-screen bg-white">
      <!-- Top Announcement Bar -->
      <div class="w-full py-2 px-4 text-center text-sm md:text-base" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #ffecd2 75%, #fcb69f 100%); color: #333; font-weight: 500;">
        🌸 Mother's Day is May 10 — Order Her Bouquet Today! 💐
      </div>

      <!-- Navigation Bar -->
      <nav class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6">
          <div class="flex items-center justify-end gap-8 py-4">
            <a href="index.html" class="text-black hover:text-[#6B8E23] transition-colors font-serif text-base md:text-lg" style="font-family: 'Playfair Display', serif">
              Home
            </a>
            <a href="shop.html" class="text-black hover:text-[#6B8E23] transition-colors font-serif text-base md:text-lg" style="font-family: 'Playfair Display', serif">
              Shop Blooms
            </a>
            <a href="about.html" class="text-black hover:text-[#6B8E23] transition-colors font-serif text-base md:text-lg" style="font-family: 'Playfair Display', serif">
              About Us
            </a>
            <a href="contact.html" class="text-black hover:text-[#6B8E23] transition-colors font-serif text-base md:text-lg" style="font-family: 'Playfair Display', serif">
              Contact Us
            </a>
          </div>
        </div>
      </nav>

      <!-- Product Detail Section -->
      <section class="py-16 md:py-24 px-6 bg-white">
        <div class="max-w-7xl mx-auto">
          <!-- Loading Message -->
          <div id="loading-message" style="text-align: center; padding: 50px;">
            <p class="text-lg text-gray-600 font-sans">Loading flower details...</p>
          </div>

          <!-- Product Container (Hidden initially) -->
          <div id="product-container" style="display: none;">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
              <!-- Left Column: Image Gallery -->
              <div>
                <!-- Main Large Image -->
                <div class="mb-4 overflow-hidden rounded-lg aspect-square">
                  <img id="mainImage" src="" alt="" class="w-full h-full object-cover">
                </div>
                
                <!-- Thumbnail Images -->
                <div id="thumbnailContainer" class="grid grid-cols-4 gap-2">
                  <!-- Thumbnails will be dynamically generated -->
                </div>
              </div>

              <!-- Right Column: Product Info -->
              <div>
                <h1 id="productTitle" class="text-3xl md:text-4xl font-bold mb-4 font-serif" style="font-family: 'Playfair Display', serif">
                  <!-- Product name will be inserted here -->
                </h1>
                
                <div class="mb-6">
                  <span id="productPrice" class="text-3xl font-bold text-[#6B8E23] font-sans">
                    <!-- Price will be inserted here -->
                  </span>
                </div>

                <!-- Delivery Date Picker -->
                <div class="mb-6">
                  <label for="deliveryDate" class="block text-sm font-medium text-gray-700 mb-2 font-sans">
                    Delivery Date <span class="text-red-500">*</span>
                  </label>
                  <input type="date" id="deliveryDate" name="deliveryDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6B8E23] focus:border-[#6B8E23] outline-none font-sans">
                </div>

                <!-- Quantity Selector -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-gray-700 mb-2 font-sans">Quantity</label>
                  <div class="flex items-center gap-4">
                    <button id="decreaseQty" class="w-10 h-10 border border-gray-300 rounded-lg flex items-center justify-center hover:bg-gray-100 transition-colors font-sans">-</button>
                    <input type="number" id="quantity" value="1" min="1" class="w-20 px-4 py-2 border border-gray-300 rounded-lg text-center focus:ring-2 focus:ring-[#6B8E23] focus:border-[#6B8E23] outline-none font-sans">
                    <button id="increaseQty" class="w-10 h-10 border border-gray-300 rounded-lg flex items-center justify-center hover:bg-gray-100 transition-colors font-sans">+</button>
                  </div>
                </div>

                <!-- Add to Cart Button -->
                <button id="addToCartBtn" class="w-full bg-black text-white py-3 px-6 rounded-lg font-medium hover:bg-gray-800 transition-colors mb-6 font-sans">
                  Add to Cart
                </button>

                <!-- SKU and Categories -->
                <div class="mb-6 pb-6 border-b border-gray-200">
                  <p id="productSku" class="text-sm text-gray-600 mb-2 font-sans">
                    <span class="font-medium">SKU:</span> <span id="skuValue"></span>
                  </p>
                  <p id="productCategory" class="text-sm text-gray-600 font-sans">
                    <span class="font-medium">Categories:</span> <span id="categoryValue"></span>
                  </p>
                </div>

                <!-- Description -->
                <div>
                  <h2 class="text-xl font-bold mb-3 font-serif" style="font-family: 'Playfair Display', serif">
                    Description
                  </h2>
                  <p id="productDescription" class="text-gray-700 leading-relaxed font-sans">
                    <!-- Description will be inserted here -->
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Related Products Section -->
      <section class="py-16 md:py-24 px-6 bg-gray-50">
        <div class="max-w-7xl mx-auto">
          <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 font-serif" style="font-family: 'Playfair Display', serif">
            Related Products
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
            <!-- Related products will be dynamically loaded here -->
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="bg-gray-900 text-white py-8 px-6">
        <div class="max-w-7xl mx-auto">
          <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-gray-400 text-sm font-sans">
              &copy; <span id="currentYear"></span> Welcome to Magnolia. All rights reserved.
            </p>
          </div>
        </div>
      </footer>
    </div>

    <script>
      // Set current year
      document.getElementById('currentYear').textContent = new Date().getFullYear();

      // Quantity Selector
      const quantityInput = document.getElementById('quantity');
      const decreaseBtn = document.getElementById('decreaseQty');
      const increaseBtn = document.getElementById('increaseQty');

      decreaseBtn.addEventListener('click', () => {
        let currentValue = parseInt(quantityInput.value);
        if (currentValue > 1) {
          quantityInput.value = currentValue - 1;
        }
      });

      increaseBtn.addEventListener('click', () => {
        let currentValue = parseInt(quantityInput.value);
        quantityInput.value = currentValue + 1;
      });

      // Add to Cart
      document.getElementById('addToCartBtn').addEventListener('click', () => {
        const deliveryDate = document.getElementById('deliveryDate').value;
        if (!deliveryDate) {
          alert('Please select a delivery date');
          return;
        }
        alert('Added to cart! Proceeding to checkout...');
      });
    </script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Config -->
    <script src="js/supabase-config.js"></script>
    <!-- Product Detail Script -->
    <script src="js/product-detail.js"></script>
  </body>
</html>
